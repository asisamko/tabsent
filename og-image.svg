<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="TabSent — keep any page focused">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#262421"/>
      <stop offset="100%" stop-color="#171614"/>
    </linearGradient>
    <radialGradient id="glow" cx="88%" cy="0%" r="85%">
      <stop offset="0%" stop-color="#D97757" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#D97757" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#D97757" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="30" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g stroke="#FFFFFF" stroke-opacity="0.035">
    <path d="M0 126h1200M0 252h1200M0 378h1200M0 504h1200"/>
    <path d="M150 0v630M300 0v630M450 0v630M600 0v630M750 0v630M900 0v630M1050 0v630"/>
  </g>

  <g transform="translate(72 64)">
    <rect width="52" height="52" rx="14" fill="#D97757"/>
    <g transform="translate(12 12)" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 14s4.5-8 12-8 12 8 12 8-4.5 8-12 8S2 14 2 14z"/>
      <circle cx="14" cy="14" r="3.5"/>
      <path d="M3 25 25 3"/>
    </g>
    <text x="70" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#FAF9F5">TabSent</text>
  </g>

  <text x="72" y="236" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="76" font-weight="750" fill="#FAF9F5">Keep any page</text>
  <text x="72" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="76" font-weight="750" fill="#FAF9F5">focused.</text>

  <text x="72" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" fill="#CFC9BE">TabSent hides blur, visibilitychange and</text>
  <text x="72" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" fill="#CFC9BE">hasFocus from websites — the page never</text>
  <text x="72" y="466" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" fill="#CFC9BE">notices when you switch away.</text>

  <g transform="translate(720 150)" filter="url(#shadow)">
    <rect width="408" height="330" rx="24" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <g transform="translate(28 28)">
      <rect width="112" height="30" rx="15" fill="#2E7D4F" fill-opacity="0.25"/>
      <circle cx="16" cy="15" r="5" fill="#4CC38A"/>
      <text x="30" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#7FD3A2">FOCUSED</text>
    </g>
    <text x="28" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#FAF9F5">The page thinks</text>
    <text x="28" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#FAF9F5">you are here.</text>

    <g font-family="ui-monospace, Menlo, monospace" font-size="15">
      <text x="28" y="182" fill="#A29D93">document.hidden</text>
      <text x="380" y="182" text-anchor="end" fill="#FAF9F5" font-weight="700">false</text>
      <line x1="28" y1="198" x2="380" y2="198" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text x="28" y="228" fill="#A29D93">visibilityState</text>
      <text x="380" y="228" text-anchor="end" fill="#FAF9F5" font-weight="700">visible</text>
      <line x1="28" y1="244" x2="380" y2="244" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text x="28" y="274" fill="#A29D93">hasFocus()</text>
      <text x="380" y="274" text-anchor="end" fill="#7FD3A2" font-weight="700">true</text>
    </g>

    <text x="28" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#A29D93">0 focus losses</text>
    <text x="380" y="312" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#A29D93">12:48 focused</text>
  </g>

  <text x="72" y="580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#A29D93">github.com/asisamko/tabsent</text>
  <text x="1128" y="580" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#A29D93">by oryks.org</text>
</svg>
